<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionnaire de tâches</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.5rem; }
    form { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
    input, select, button { padding: 8px; font-size: 1rem; }
    input[type="text"] { flex: 1; }
    ul { list-style: none; padding: 0; }
    li { display: flex; align-items: center; gap: 10px; padding: 8px; border-bottom: 1px solid #ddd; }
    li.done .task-title { text-decoration: line-through; color: #888; }
    .priority { font-size: 0.8rem; padding: 2px 8px; border-radius: 10px; background: #eee; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Gestionnaire de tâches</h1>

  <form id="task-form">
    <input type="text" id="task-title" data-testid="task-title-input" placeholder="Titre de la tâche" />
    <select id="task-priority" data-testid="task-priority-select">
      <option value="basse">Basse</option>
      <option value="normale" selected>Normale</option>
      <option value="haute">Haute</option>
    </select>
    <button type="submit" data-testid="task-submit">Ajouter</button>
  </form>

  <p id="error-message" class="error" data-testid="error-message"></p>

  <ul id="task-list" data-testid="task-list"></ul>

  <script>
    const form = document.getElementById('task-form');
    const titleInput = document.getElementById('task-title');
    const prioritySelect = document.getElementById('task-priority');
    const list = document.getElementById('task-list');
    const errorMessage = document.getElementById('error-message');

    async function loadTasks() {
      const res = await fetch('/api/tasks');
      const tasks = await res.json();
      list.innerHTML = '';
      tasks.forEach((task) => {
        const li = document.createElement('li');
        li.dataset.testid = 'task-item';
        if (task.done) li.classList.add('done');
        li.innerHTML = `
          <span class="task-title">${task.title}</span>
          <span class="priority">${task.priority}</span>
        `;
        if (!task.done) {
          const btn = document.createElement('button');
          btn.textContent = 'Terminer';
          btn.dataset.testid = 'task-done-button';
          btn.addEventListener('click', async () => {
            await fetch(`/api/tasks/${task.id}/done`, { method: 'PATCH' });
            loadTasks();
          });
          li.appendChild(btn);
        }
        list.appendChild(li);
      });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMessage.textContent = '';
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: titleInput.value,
          priority: prioritySelect.value,
        }),
      });
      if (!res.ok) {
        const data = await res.json();
        errorMessage.textContent = data.error;
        return;
      }
      titleInput.value = '';
      loadTasks();
    });

    loadTasks();
  </script>
</body>
</html>
